   apiVersion: apps/v1
   kind: Deployment
   metadata:
     name: the-app
   spec:
     replicas: 1
     selector:
       matchLabels:
         app: the-app
     template:
       metadata:
         labels:
           app: the-app
       spec:
         containers:
           - name: web
             image: nginx:alpine
             ports:
               - containerPort: 80
