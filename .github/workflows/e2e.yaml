   # .github/workflows/e2e.yaml
   name: E2E Tests
   on:
     pull_request:
       branches: [main]
   jobs:
     e2e:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: loft-sh/setup-vind@v1
           with:
             config: hack/vcluster.yaml
         - run: docker ps
         - run: kubectl get nodes
         - run: make e2e

